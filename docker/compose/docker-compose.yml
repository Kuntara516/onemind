name: onemind

services:
  
  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: ../../services/api-gateway

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  planner-runtime:
    build:
      context: ../../services/planner-runtime

    ports:
      - "8001:8001"

  agent-runtime:
    build:
      context: ../../services/agent-runtime

    ports:
      - "8002:8002"

    depends_on:
      - planner-runtime
      - postgres
      - redis
      - qdrant

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
